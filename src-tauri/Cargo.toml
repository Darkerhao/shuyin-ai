[package]
name = "shuyin-ai"
version = "0.3.0"
description = "书引 AI M0 工程验证"
edition = "2021"
rust-version = "1.95"

[lib]
name = "shuyin_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.3"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "=3.27.0"
