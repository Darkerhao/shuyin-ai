[package]
name = "shuyin-ai"
version = "0.8.0"
description = "书引 AI M0 工程验证"
edition = "2021"
rust-version = "1.95"

[lib]
name = "shuyin_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.3"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.154"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
keyring = "=4.2.0"
tokio = { version = "=1.54.1", features = ["sync", "macros", "time"] }
base64 = "=0.23.1"
png = "=0.18.1"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }

[dev-dependencies]
tempfile = "=3.27.0"
