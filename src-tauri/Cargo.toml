[package]
name = "shuyin-ai"
version = "0.20.0"
description = "书引 AI M0 工程验证"
edition = "2021"
rust-version = "1.95"

[lib]
name = "shuyin_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-updater = "=2.14.0"
tauri-plugin-process = "=2.4.0"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.154"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
keyring = "=4.2.0"
tokio = { version = "=1.54.1", features = ["sync", "macros", "time", "net", "io-util"] }
base64 = "=0.23.1"
png = "=0.18.1"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
sha2 = "=0.11.1"
mp4parse = "=0.17.0"

[target.'cfg(windows)'.dependencies]
# Already locked by Tauri; used only for host-side, task-bound file selection.
webview2-com = "=0.39.1"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "=3.27.0"
