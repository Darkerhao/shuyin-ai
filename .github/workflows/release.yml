name: Desktop packages and version sync

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event.deleted == false && !startsWith(github.event.head_commit.message, 'chore(release): v')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      skip: ${{ steps.version.outputs.skip }}
      base: ${{ steps.version.outputs.base }}
      commit: ${{ steps.version.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      source-artifact: ${{ steps.source.outputs.artifact-id }}
    steps:
      # Always build code from main; dev and tag pushes do not trigger this workflow.
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Prepare one version commit and export it without pushing
        id: version
        env:
          RELEASE_BUNDLE: ${{ runner.temp }}/release.bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release.mjs prepare
      - name: Verify frontend and release logic
        if: steps.version.outputs.skip != 'true'
        run: |
          npm ci
          npm run lint
          npm test
      - name: Share exact version commit with build runners
        if: steps.version.outputs.skip != 'true'
        id: source
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-source-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release.bundle
          if-no-files-found: error
          retention-days: 90

  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      RELEASE_BASE: ${{ needs.prepare.outputs.base }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.source-artifact }}
          path: ${{ runner.temp }}/release-source
          merge-multiple: true
      - name: Restore exact prepared source
        env:
          RELEASE_BUNDLE: ${{ runner.temp }}/release-source/release.bundle
        run: |
          git checkout --detach "$RELEASE_BASE"
          node scripts/release.mjs restore
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install locked dependencies and Rust
        run: |
          npm ci
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy --target "$BUILD_TARGET"
          rustup override set 1.99.1
      - name: Rust checks and database tests on each platform
        run: |
          npm run check:rust
          npm run test:rust
          node --test tests/release-assets.test.mjs
          node --test tests/audio-package.test.mjs
          node --test tests/audio-extension.test.mjs
      - name: Test and prepare Windows Native Messaging helper
        if: runner.os == 'Windows'
        run: |
          cargo fmt --manifest-path src-tauri/browser-bridge/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/browser-bridge/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/browser-bridge/Cargo.toml --locked
          node scripts/build-audio-bridge.mjs --release --target "$BUILD_TARGET"
      - name: Build platform packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Missing TAURI_SIGNING_PRIVATE_KEY: signed updater packages are required."
            exit 1
          fi
          export VITE_RELEASE_NOTES="$(node scripts/release-assets.mjs notes)"
          npm run desktop:build -- --target "$BUILD_TARGET" -- --locked
      - name: Verify Windows automatic-audio bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $release = "src-tauri/target/$env:BUILD_TARGET/release"
          if (!(Test-Path -LiteralPath "$release/browser-bridge.exe" -PathType Leaf)) { throw "Missing Native Messaging helper in release output" }
          $installer = Get-ChildItem -Path "$release/nsis" -Filter installer.nsi -Recurse | Select-Object -First 1
          if (!$installer) { throw "NSIS installer script was not generated" }
          $script = Get-Content -LiteralPath $installer.FullName -Raw
          foreach ($entry in @("browser-bridge.exe", "browser-extension", "installer-hooks.nsh")) {
            if ($script -notmatch [regex]::Escape($entry)) { throw "NSIS bundle is missing $entry" }
          }
      - name: Collect installers and archives
        run: node scripts/release-assets.mjs collect "$BUILD_PLATFORM" "$BUILD_TARGET" output/release
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: packages-${{ needs.prepare.outputs.commit }}-${{ matrix.platform }}
          path: output/release/*
          if-no-files-found: error
          overwrite: true
          retention-days: 90
          compression-level: 0

  sync:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_BASE: ${{ needs.prepare.outputs.base }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.source-artifact }}
          path: ${{ runner.temp }}/release-source
          merge-multiple: true
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: packages-${{ needs.prepare.outputs.commit }}-*
          path: output/release
          merge-multiple: true
      - name: Verify every package, then sync main, dev and tag atomically
        env:
          RELEASE_BUNDLE: ${{ runner.temp }}/release-source/release.bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach "$RELEASE_BASE"
          node scripts/release.mjs restore
          node scripts/release-assets.mjs verify output/release "$RELEASE_VERSION"
          node scripts/release.mjs finalize

  publish:
    needs: [prepare, sync]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: packages-${{ needs.prepare.outputs.commit }}-*
          path: output/release
          merge-multiple: true
      - name: Publish complete GitHub Release
        run: |
          git checkout --detach "$RELEASE_COMMIT"
          node scripts/release-assets.mjs publish output/release "$RELEASE_VERSION" "$RELEASE_COMMIT"
